annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Compute statistical divergence between evaluators to flag outlier scoring
  anomalies.
input_schema:
  additionalProperties: false
  properties:
    candidate_cohort_id:
      type: string
    metric_id:
      type: string
  required:
  - candidate_cohort_id
  type: object
name: audit-committee-bias-distribution
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
